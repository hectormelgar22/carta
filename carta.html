/* Coloca una página en la capa estática SIN reinsertarla si ya está ahí:
   reinsertar un nodo reinicia sus animaciones CSS y provoca un parpadeo. */
function setLayer(node) {
  if (DOM.layer.firstElementChild !== node) DOM.layer.replaceChildren(node);
}

/* Re-lanza el revelado cada vez que una página vuelve a ser la visible. */
function playReveal(node) {
  if (!node) return;
  node.classList.remove("is-live");
  void node.offsetWidth;           // fuerza el reinicio de las animaciones
  node.classList.add("is-live");
}

/* ═══════════════════════════════════════════════════════════════
   PAGE_TURN — el corazón del producto
   ═══════════════════════════════════════════════════════════════ */
/* Invariante: la hoja que gira lleva SIEMPRE la página de índice menor,
   y la capa estática lleva SIEMPRE la de índice mayor. Sirve igual para
   avanzar, retroceder, pasar rápido y arrastrar con el dedo. */
function mountTurn(from, to) {
  closeSheet();
  closeDogear();          // el libro nunca se mueve con un panel abierto encima
  DOM.leafHost.replaceChildren(pageNode(Math.min(from, to)));
  setLayer(pageNode(Math.max(from, to)));
}

/** Inversa de TURN_CURVE: en qué punto del giro la hoja tiene ese ángulo. */
function curveTimeFor(deg) {
  const c = TURN_CURVE;
  const d = Math.max(c[c.length - 1][1], Math.min(0, deg));
  for (let i = 1; i < c.length; i++) {
    if (d >= c[i][1]) {
      const a0 = c[i - 1][1], a1 = c[i][1];
      if (a0 === a1) return c[i][0];
      return c[i - 1][0] + (c[i][0] - c[i - 1][0]) * ((d - a0) / (a1 - a0));
    }
  }
  return 1;
}

/* Arranca la animación de la hoja. `seek` (0..1) permite empezar en un
   fotograma concreto: es lo que evita el salto al soltar un arrastre. */
function playLeaf(dirClass, opening, seek) {
  DOM.viewport.classList.add("turning", dirClass);
  if (opening) {
    DOM.viewport.classList.add("turning--open");
    DOM.book.classList.add("is-opening");
    document.body.classList.add("is-opening");
  }
  if (!seek) return;
  const ms = (opening ? CONFIG.openMs : CONFIG.turnMs) * seek;
  [DOM.leaf, DOM.shade, DOM.gloss, DOM.cast].forEach(node => {
    if (!node || !node.getAnimations) return;
    node.getAnimations().forEach(a => { try { a.currentTime = ms; } catch (err) {} });
  });
}

function turn(direction) {
  const from = State.page;
  const to = from + direction;
  if (State.animating || to < 0 || to >= State.pages.length) return;

  State.animating = true;
  const opening = !State.opened && from === 0 && direction === 1;
  if (opening) askTiltPermission();   // único gesto natural para pedirlo
  const duration = opening ? CONFIG.openMs : CONFIG.turnMs;

  mountTurn(from, to);
  playLeaf(direction === 1 ? "turning--next" : "turning--prev", opening, 0);

  // El contenido de destino aparece mientras la hoja aún está en el aire.
  window.setTimeout(() => playReveal(pageNode(to)), duration * CONFIG.revealAt);
  finishTurn(to, opening, duration, true);
}

/* Salto de sección. Varias hojas cruzan escalonadas y el conjunto dura
   menos de la mitad que un giro normal: se lee como "pasar páginas", no
   como cambiar de pantalla. Un salto de una sola página se resuelve con
   un giro normal, porque ahí el pase rápido no tendría nada que contar. */
function jumpTo(target) {
  const from = State.page;
  if (State.animating || target === from) return;
  if (target < 0 || target >= State.pages.length) return;
  if (Math.abs(target - from) === 1) { turn(target > from ? 1 : -1); return; }

  State.animating = true;
  mountTurn(from, target);
  DOM.viewport.classList.add("riffling", target > from ? "riffling--next" : "riffling--prev");
  window.setTimeout(() => playReveal(pageNode(target)), CONFIG.riffleMs * 0.55);
  finishTurn(target, false, CONFIG.riffleMs, false);
}

/* Cierre del giro: escucha animationend con red de seguridad por si el
   navegador no la dispara (pestaña en segundo plano, motor antiguo). En el
   pase rápido animationend no sirve —la hoja principal termina antes que
   las sueltas—, así que ahí manda el temporizador. */
function finishTurn(to, opening, duration, watchLeaf) {
  let done = false;

  const settle = () => {
    if (done) return;
    done = true;
    DOM.leaf.removeEventListener("animationend", onEnd);
    window.clearTimeout(guard);

    State.page = to;
    State.animating = false;
    if (opening) {
      State.opened = true;
      DOM.book.classList.remove("is-opening");
      document.body.classList.remove("is-opening");
    }

    setLayer(pageNode(to));
    DOM.leafHost.replaceChildren();
    DOM.viewport.classList.remove(
      "turning", "turning--next", "turning--prev", "turning--open",
      "riffling", "riffling--next", "riffling--prev", "is-dragging");
    ["--dp", "--dcast", "--dcos"].forEach(v => DOM.viewport.style.removeProperty(v));
    DOM.leaf.style.removeProperty("transform");

    syncChrome();
    preloadAround(to);
  };

  const onEnd = (e) => { if (e.target === DOM.leaf) settle(); };
  if (watchLeaf) DOM.leaf.addEventListener("animationend", onEnd);
  const guard = window.setTimeout(settle, duration + (watchLeaf ? 220 : 70));
}

/* ═══════════════════════════════════════════════════════════════
   THEME — modo día / noche
   La hora del dispositivo decide, salvo que el cliente haya elegido.
   No cambia el diseño: cambia la luz de la sala.
   ═══════════════════════════════════════════════════════════════ */
function autoMode() {
  const theme = CARTA.theme || {};
  if (theme.nightMode === false) return "day";
  if (theme.dayMode === false) return "night";
  const hour = new Date().getHours();
  const from = Number(theme.nightFrom);
  const until = Number(theme.nightUntil);
  if (!isFinite(from) || !isFinite(until)) return "night";
  return (hour >= from || hour < until) ? "night" : "day";
}

function setMode(mode, remember) {
  const next = mode === "day" ? "day" : "night";
  if (State.mode === next) return;
  State.mode = next;
  if (remember) Store.set("mode", next);

  // La transición sólo vive durante el cambio.
  document.documentElement.classList.add("is-theming");
  document.documentElement.dataset.mode = next;
  window.clearTimeout(State.themeTimer);
  State.themeTimer = window.setTimeout(
    () => document.documentElement.classList.remove("is-theming"), 720);

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    const amb = getComputedStyle(document.documentElement).getPropertyValue("--amb-2").trim();
    if (amb) meta.setAttribute("content", amb);
  }
  syncChrome();
}

/* ═══════════════════════════════════════════════════════════════
   LANGUAGE — cambio instantáneo, sin recargar ni cambiar de URL
   Las páginas están cacheadas y se construyeron en un idioma, así que
   se tira la caché y se reconstruye sólo la que se está viendo.
   ═══════════════════════════════════════════════════════════════ */
function languages() {
  const list = (CARTA.settings.languages || []).filter(Boolean);
  return list.length ? list : [CARTA.settings.defaultLanguage || "es"];
}

function setLanguage(lang, silent) {
  const list = languages();
  const next = list.indexOf(lang) >= 0 ? lang : list[0];
  if (next === State.lang && !silent) return;

  State.lang = next;
  Store.set("lang", next);
  document.documentElement.lang = next;
  if (silent) return;

  closeDogear();
  pageCache.clear();
  State.sections = buildSections(State.pages);
  renderTabs();

  // Cruce corto: la página se apaga, se reconstruye y vuelve.
  DOM.layer.classList.add("is-swapping");
  window.setTimeout(() => {
    setLayer(pageNode(State.page));
    DOM.layer.classList.remove("is-swapping");
    playReveal(pageNode(State.page));
    syncChrome();
  }, 220);
}

function renderDogear() {
  const list = languages();
  if (list.length < 2) { DOM.dogear.hidden = true; return; }
  DOM.dogear.hidden = false;
  DOM.dogearMenu.setAttribute("aria-label", ui("language"));
  DOM.dogearMenu.replaceChildren(...list.map(code => {
    const btn = el("button", "lang", code.toUpperCase());
    btn.type = "button";
    btn.dataset.lang = code;
    btn.addEventListener("click", () => setLanguage(code));
    return btn;
  }));
}

function toggleDogear(force) {
  const open = force != null ? force : !DOM.dogear.classList.contains("is-open");
  DOM.dogear.classList.toggle("is-open", open);
  DOM.dogearFold.setAttribute("aria-expanded", open ? "true" : "false");
}
function closeDogear() { toggleDogear(false); }

/* ═══════════════════════════════════════════════════════════════
   PARALLAX — 4 a 10 px, ni uno más
   Si no hay sensor, si el usuario lo deniega o si pide menos
   movimiento, --px y --py se quedan a cero y no pasa nada.
   ═══════════════════════════════════════════════════════════════ */
const Tilt = { on: false, x: 0, y: 0, tx: 0, ty: 0, frame: 0, base: null };

function tiltTo(x, y) {
  Tilt.tx = Math.max(-1, Math.min(1, x));
  Tilt.ty = Math.max(-1, Math.min(1, y));
  if (Tilt.frame) return;
  Tilt.frame = window.requestAnimationFrame(tiltFrame);
}

/* Suavizado exponencial: el sensor da saltos, el papel no. */
function tiltFrame() {
  Tilt.frame = 0;
  Tilt.x += (Tilt.tx - Tilt.x) * 0.12;
  Tilt.y += (Tilt.ty - Tilt.y) * 0.12;
  const root = document.documentElement.style;
  root.setProperty("--px", Tilt.x.toFixed(3));
  root.setProperty("--py", Tilt.y.toFixed(3));
  if (Math.abs(Tilt.tx - Tilt.x) > 0.002 || Math.abs(Tilt.ty - Tilt.y) > 0.002) {
    Tilt.frame = window.requestAnimationFrame(tiltFrame);
  }
}

function onOrientation(e) {
  if (e.gamma == null && e.beta == null) return;
  Tilt.on = true;
  // La primera lectura fija el punto neutro: cada uno sostiene el móvil
  // como quiere, y el reposo debe ser donde ya lo tiene.
  if (!Tilt.base) Tilt.base = { g: e.gamma || 0, b: e.beta || 0 };
  tiltTo((( e.gamma || 0) - Tilt.base.g) / 26, (((e.beta || 0) - Tilt.base.b) / 30));
}

function startParallax() {
  if (CARTA.theme.parallax === false || State.reducedMotion) return;
  if (!("DeviceOrientationEvent" in window)) return;
  try { window.addEventListener("deviceorientation", onOrientation, { passive: true }); }
  catch (e) { /* sin sensor, sin parallax */ }
}

/* iOS exige pedir permiso desde un gesto del usuario: abrir la carta es
   el único momento natural. Si lo deniega, no se vuelve a preguntar. */
function askTiltPermission() {
  if (CARTA.theme.parallax === false || State.reducedMotion) return;
  const api = window.DeviceOrientationEvent;
  if (!api || typeof api.requestPermission !== "function") return;
  try {
    api.requestPermission().then(res => { if (res === "granted") startParallax(); }).catch(() => {});
  } catch (e) { /* nada que hacer */ }
}

/* En escritorio el ratón hace el mismo trabajo, sin permisos. */
function startPointerParallax() {
  if (CARTA.theme.parallax === false || State.reducedMotion) return;
  if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
  window.addEventListener("pointermove", e => {
    if (Tilt.on) return;                       // el sensor tiene prioridad
    tiltTo((e.clientX / window.innerWidth - 0.5) * 2, (e.clientY / window.innerHeight - 0.5) * 2);
  }, { passive: true });
}

/* ═══════════════════════════════════════════════════════════════
   ORDERING — mesa, pedido y WhatsApp
   No hay backend ni pasarela: la carta sólo prepara el mensaje. Todo
   lo que se guarda vive en la sesión de este teléfono.
   ═══════════════════════════════════════════════════════════════ */
function canOrder() {
  return CARTA.settings.ordering === true && !!waLink("probe");
}
function canOrderDirect() {
  return CARTA.settings.ordering !== true && !!waLink("probe");
}

/** wa.me sirve igual con la app instalada y sin ella: el navegador
    abre la versión web. Ese es el fallback que pide el pliego. */
function waLink(message) {
  const digits = String((CARTA.contact || {}).whatsapp || "").replace(/\D/g, "");
  if (digits.length < 8) return null;
  return "https://wa.me/" + digits + "?text=" + encodeURIComponent(message);
}

function openExternal(url) {
  if (!url) return false;
  try {
    const win = window.open(url, "_blank", "noopener");
    if (!win) window.location.href = url;     // bloqueador de ventanas
    return true;
  } catch (e) {
    try { window.location.href = url; return true; } catch (err) { return false; }
  }
}

function sendWhatsApp(message) {
  const url = waLink(message);
  if (url) openExternal(url);
}

/* ── Mesa ───────────────────────────────────────────────────── */
function tableMode() { return CARTA.settings.tableMode === true; }

function setTable(value) {
  const clean = String(value == null ? "" : value).trim().slice(0, 6);
  State.table = clean || null;
  Store.set("table", State.table);
  syncChrome();
}

/* ── Pedido ─────────────────────────────────────────────────── */
function orderCount() {
  return State.order.reduce((n, line) => n + line.qty, 0);
}
function orderTotal() {
  return State.order.reduce((sum, line) => {
    const dish = dishById(line.id);
    return sum + (dish ? Number(dish.price) || 0 : 0) * line.qty;
  }, 0);
}
function orderSet(id, qty) {
  const next = Math.max(0, Math.min(99, qty));
  const i = State.order.findIndex(line => line.id === id);
  if (next === 0) { if (i >= 0) State.order.splice(i, 1); }
  else if (i >= 0) State.order[i].qty = next;
  else State.order.push({ id, qty: next });
  saveOrder();
  syncChrome();
}
function orderAdd(id) {
  const line = State.order.find(l => l.id === id);
  orderSet(id, (line ? line.qty : 0) + 1);
}
function saveOrder() {
  try { Store.set("order", JSON.stringify(State.order)); } catch (e) {}
}
function loadOrder() {
  try {
    const raw = JSON.parse(Store.get("order") || "[]");
    if (!Array.isArray(raw)) return [];
    // Sólo sobreviven las líneas que siguen existiendo y disponibles en CARTA.
    return raw
      .filter(l => l && typeof l.id === "string" && Number(l.qty) > 0)
      .map(l => ({ id: l.id, qty: Math.min(99, Math.round(Number(l.qty))) }))
      .filter(l => { const d = dishById(l.id); return d && d.available !== false; });
  } catch (e) { return []; }
}

/** El mensaje del pedido completo, tal cual llega al restaurante. */
function orderMessage() {
  const head = State.table
    ? fill("msgOrder", { table: State.table })
    : ui("msgOrderNoTable");
  const lines = State.order.map(line => {
    const dish = dishById(line.id);
    return dish ? line.qty + "x " + t(dish.name) : null;
  }).filter(Boolean);
  return [head, "", lines.join("\n"), "", fill("msgTotal", { total: money(orderTotal()) })].join("\n");
}

/* ═══════════════════════════════════════════════════════════════
   SHEET — panel de alérgenos, picante y maridaje
   Vive dentro del libro, no es una página nueva y nunca tapa el plato
   entero. Un único elemento con el contenido intercambiable.
   ═══════════════════════════════════════════════════════════════ */
const Sheet = { open: false, lastFocus: null, timer: 0 };

/* Pintar y abrir están separados porque el pedido se repinta en vivo
   al cambiar cantidades, y repintar no debe reabrir ni robar el foco. */
function paintSheet(eyebrow, title, build) {
  DOM.sheetEyebrow.textContent = eyebrow;
  DOM.sheetTitle.textContent = title;
  DOM.sheetBody.replaceChildren();
  build(DOM.sheetBody);
}

function openSheet(eyebrow, title, build, focusSelector) {
  window.clearTimeout(Sheet.timer);
  if (!Sheet.open) Sheet.lastFocus = document.activeElement;

  paintSheet(eyebrow, title, build);

  DOM.sheet.hidden = false;
  void DOM.sheet.offsetWidth;        // fuerza el estado inicial antes de animar
  DOM.sheet.classList.add("is-open");
  Sheet.open = true;

  const first = focusSelector ? DOM.sheetBody.querySelector(focusSelector) : null;
  try { (first || DOM.sheetClose).focus({ preventScroll: true }); } catch (e) {}
}

function closeSheet() {
  if (!Sheet.open) return;
  Sheet.open = false;
  DOM.sheet.classList.remove("is-open");
  Sheet.timer = window.setTimeout(() => { DOM.sheet.hidden = true; }, 320);
  const back = Sheet.lastFocus;
  Sheet.lastFocus = null;
  if (back && back.isConnected) { try { back.focus({ preventScroll: true }); } catch (e) {} }
}

function openAllergenSheet(dish) {
  const catalogue = (CARTA.glossary || {}).allergens || {};
  openSheet(ui("allergens"), t(dish.name), body => {
    const list = el("ul", "sheet__list");
    (dish.allergens || []).forEach(key => {
      if (!catalogue[key]) return;          // lo que no está en CARTA no se inventa
      list.appendChild(el("li", "sheet__item", t(catalogue[key])));
    });
    body.appendChild(list);
    body.appendChild(el("p", "sheet__note", ui("disclaimer")));
  });
}

function openSpiceSheet(dish) {
  const scaleList = (CARTA.glossary || {}).spice || [];
  const level = Number(dish.spicy) || 0;
  const spec = scaleList[level];
  if (!spec) return;
  const max = Math.max(1, scaleList.length - 1);

  openSheet(ui("spiceTitle"), t(spec) + " · " + level + "/" + max, body => {
    const scale = el("div", "sheet__scale");
    scale.setAttribute("aria-hidden", "true");
    for (let i = 1; i <= max; i++) {
      const slot = el("span", i <= level ? "" : "is-off");
      slot.insertAdjacentHTML("beforeend", ICON.chilli);
      scale.appendChild(slot);
    }
    body.appendChild(scale);
    if (spec.note) body.appendChild(el("p", "sheet__text", t(spec.note)));
    body.appendChild(el("p", "sheet__note", ui("disclaimer")));
  });
}

/** Etiqueta del botón según lo que se recomienda: bebida, postre o plato. */
function ctaFor(target) {
  if (target.category === "bebidas") return ui("seeDrink");
  if (target.category === "postres") return ui("seeDessert");
  return ui("see");
}

function openPairingSheet(dish, target, pairing) {
  openSheet(ui("pairing"), t(target.name), body => {
    body.appendChild(el("p", "sheet__text", t(target.description)));
    if (pairing.reason) body.appendChild(el("p", "sheet__quote", "«" + t(pairing.reason) + "»"));

    const foot = el("div", "sheet__foot");
    foot.appendChild(el("span", "sheet__price", money(target.price)));

    const cta = el("button", "sheet__cta");
    cta.type = "button";
    cta.appendChild(document.createTextNode(ctaFor(target)));
    cta.insertAdjacentHTML("beforeend", ICON.arrow);
    cta.addEventListener("click", () => {
      const page = pageOfDish(target.id);
      closeSheet();
      if (page >= 0) jumpTo(page);
    });
    foot.appendChild(cta);
    body.appendChild(foot);
  });
}

/* ── Panel de la mesa ───────────────────────────────────────── */
function openTableSheet() {
  openSheet(CARTA.restaurant.name, ui("tableAsk"), body => {
    const field = el("div", "split__field");
    field.appendChild(el("span", "split__label", ui("tableShort")));
    const input = el("input", "split__input");
    input.type = "text";
    input.inputMode = "numeric";
    input.autocomplete = "off";
    input.maxLength = 6;
    input.value = State.table || "";
    input.setAttribute("aria-label", ui("tableAsk"));
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); setTable(input.value); closeSheet(); }
    });
    field.appendChild(input);
    body.appendChild(field);
    body.appendChild(el("p", "sheet__note", ui("tableHelp")));

    const foot = el("div", "sheet__foot");
    if (State.table) {
      const clear = el("button", "pill");
      clear.type = "button";
      clear.textContent = ui("tableClear");
      clear.addEventListener("click", () => { setTable(null); closeSheet(); });
      foot.appendChild(clear);
    }
    const save = el("button", "sheet__cta");
    save.type = "button";
    save.textContent = ui("tableSave");
    save.addEventListener("click", () => { setTable(input.value); closeSheet(); });
    foot.appendChild(save);
    body.appendChild(foot);

    const help = waiterButton();
    if (help) { help.style.marginTop = "16px"; body.appendChild(help); }
  }, ".split__input");
}

/** Botón de aviso al camarero. Devuelve null si el restaurante no lo quiere. */
function waiterButton() {
  if (CARTA.settings.waiterRequest !== true || !waLink("probe")) return null;
  const btn = el("button", "pill");
  btn.type = "button";
  btn.textContent = ui("waiter");
  btn.addEventListener("click", () => {
    sendWhatsApp(State.table ? fill("msgWaiter", { table: State.table }) : ui("msgWaiterNoTable"));
    closeSheet();
  });
  return btn;
}

/* ── Panel del pedido ───────────────────────────────────────── */
function openCartSheet() { openSheet(CARTA.restaurant.name, ui("yourOrder"), buildCart); }

function refreshCart(focusKey) {
  paintSheet(CARTA.restaurant.name, ui("yourOrder"), buildCart);
  const back = focusKey ? DOM.sheetBody.querySelector('[data-focus="' + focusKey + '"]') : null;
  if (back) { try { back.focus({ preventScroll: true }); } catch (e) {} }
}

function qtyButton(icon, label, id, next, key) {
  const btn = el("button", "qty");
  btn.type = "button";
  btn.dataset.focus = key;
  btn.setAttribute("aria-label", label);
  btn.insertAdjacentHTML("beforeend", icon);
  btn.addEventListener("click", () => { orderSet(id, next); refreshCart(key); });
  return btn;
}

function buildCart(body) {
  if (tableMode()) {
    const chip = el("button", "pill");
    chip.type = "button";
    chip.textContent = State.table ? ui("tableShort") + " " + State.table : ui("tableAsk");
    chip.addEventListener("click", openTableSheet);
    body.appendChild(chip);
  }

  if (!State.order.length) {
    body.appendChild(el("p", "sheet__text", ui("orderEmpty")));
    return;
  }

  State.order.forEach(line => {
    const dish = dishById(line.id);
    if (!dish) return;
    const row = el("div", "cart__row");
    row.appendChild(el("p", "cart__name", t(dish.name)));
    const qty = el("div", "cart__qty");
    qty.appendChild(qtyButton(ICON.minus, ui("less"), line.id, line.qty - 1, "minus-" + line.id));
    qty.appendChild(el("span", "cart__n", String(line.qty)));
    qty.appendChild(qtyButton(ICON.plus, ui("more"), line.id, line.qty + 1, "plus-" + line.id));
    row.appendChild(qty);
    row.appendChild(el("span", "cart__line", money((Number(dish.price) || 0) * line.qty)));
    body.appendChild(row);
  });

  const total = el("div", "cart__total");
  total.appendChild(el("span", null, ui("total")));
  total.appendChild(el("i"));
  total.appendChild(el("b", null, money(orderTotal())));
  body.appendChild(total);

  // El aviso va ANTES del botón: si queda bajo el pliegue del panel, nadie
  // lo lee, y aquí importa dejar claro que esto no es un pago.
  body.appendChild(el("p", "sheet__note", ui("orderNote")));

  const cta = el("button", "sheet__cta sheet__cta--wide");
  cta.type = "button";
  cta.appendChild(document.createTextNode(ui("sendOrder")));
  cta.insertAdjacentHTML("beforeend", ICON.send);
  cta.addEventListener("click", () => sendWhatsApp(orderMessage()));
  body.appendChild(cta);
}

/* ── Dividir la cuenta ──────────────────────────────────────── */
function openSplitSheet() {
  openSheet(CARTA.restaurant.name, ui("split"), body => {
    const seed = orderTotal();          // si hay pedido, ya viene puesto
    let people = 2;

    const totalField = el("div", "split__field");
    totalField.appendChild(el("span", "split__label", ui("splitTotal")));
    const input = el("input", "split__input");
    input.type = "text";
    input.inputMode = "decimal";
    input.autocomplete = "off";
    input.maxLength = 9;
    input.placeholder = "0,00";
    input.value = seed > 0 ? seed.toFixed(2).replace(".", ",") : "";
    input.setAttribute("aria-label", ui("splitTotal"));
    totalField.appendChild(input);
    body.appendChild(totalField);

    const peopleField = el("div", "split__field");
    peopleField.appendChild(el("span", "split__label", ui("splitPeople")));
    const group = el("div", "split__people");
    const count = el("span", "cart__n", String(people));
    const step = (delta, label) => {
      const btn = el("button", "qty");
      btn.type = "button";
      btn.setAttribute("aria-label", label);
      btn.insertAdjacentHTML("beforeend", delta < 0 ? ICON.minus : ICON.plus);
      btn.addEventListener("click", () => {
        people = Math.max(1, Math.min(40, people + delta));
        recalc();
      });
      return btn;
    };
    group.appendChild(step(-1, ui("less")));
    group.appendChild(count);
    group.appendChild(step(1, ui("more")));
    peopleField.appendChild(group);
    body.appendChild(peopleField);

    const result = el("div", "split__result");
    const amount = el("b", null, "—");
    result.appendChild(amount);
    result.appendChild(el("span", null, ui("splitEach")));
    body.appendChild(result);
    body.appendChild(el("p", "sheet__note", ui("splitNote")));

    // Nunca imprime NaN: si el importe no es válido, muestra una raya.
    function recalc() {
      count.textContent = String(people);
      const raw = input.value.replace(/[^\d.,]/g, "").replace(",", ".");
      const total = parseFloat(raw);
      amount.textContent = (isFinite(total) && total > 0) ? money(total / people) : "—";
    }
    input.addEventListener("input", recalc);
    recalc();
  }, ".split__input");
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION — estado de la interfaz alrededor del libro
   ═══════════════════════════════════════════════════════════════ */
/** Pequeño "pop" del contador al añadir algo al pedido. */
function popCart() {
  DOM.chipCart.classList.remove("is-pop");
  void DOM.chipCart.offsetWidth;
  DOM.chipCart.classList.add("is-pop");
}

function renderTabs() {
  DOM.tabs.replaceChildren(...State.sections.map(section => {
    const tab = el("button", "tab");
    tab.type = "button";
    tab.dataset.section = section.id;
    tab.setAttribute("aria-label", ui("goTo") + " " + section.name);
    tab.appendChild(el("span", "tab__label", section.tab));
    tab.addEventListener("click", () => jumpTo(section.page));
    return tab;
  }));
}

function syncChrome() {
  const last = State.pages.length - 1;
  DOM.btnPrev.disabled = State.page <= 0;
  DOM.btnNext.disabled = State.page >= last;
  // La portada no lleva folio: en un libro tampoco lo lleva.
  DOM.folioNow.textContent = State.page === 0 ? "—" : pad2(State.page);
  DOM.folioAll.textContent = pad2(last);
  DOM.controls.classList.toggle("is-on", State.opened);
  DOM.tabs.classList.toggle("is-on", State.opened);

  // Barra superior: mesa a la izquierda, pedido a la derecha. El pedido
  // sólo existe cuando hay algo dentro.
  const showTable = tableMode();
  DOM.chipTable.hidden = !showTable;
  if (showTable) {
    const label = State.table ? ui("tableShort") + " " + State.table : ui("tableChip");
    DOM.chipTableText.textContent = label;
    DOM.chipTable.classList.toggle("is-ask", !State.table);
    DOM.chipTable.setAttribute("aria-label", State.table ? label : ui("tableAsk"));
  }

  const count = orderCount();
  const showCart = canOrder() && count > 0;
  DOM.chipCart.hidden = !showCart;
  if (showCart) {
    DOM.chipCartCount.textContent = String(count);
    DOM.chipCartTotal.textContent = money(orderTotal());
    DOM.chipCart.setAttribute("aria-label",
      ui("yourOrder") + ": " + count + " · " + money(orderTotal()));
  }
  const showTheme = CARTA.theme.manualToggle !== false
    && CARTA.theme.dayMode !== false && CARTA.theme.nightMode !== false;
  DOM.themeToggle.hidden = !showTheme;
  if (showTheme) {
    DOM.themeToggle.setAttribute("aria-label",
      State.mode === "night" ? ui("dayMode") : ui("nightMode"));
  }
  DOM.topbar.classList.toggle("is-on", State.opened && (showTable || showCart || showTheme));

  // Marcapáginas: visible desde que el libro se abre, y hundido cuando
  // ya estás en su página.
  const specialPage = State.pages.findIndex(p => p.type === "special");
  DOM.bookmark.hidden = specialPage < 0 || !State.opened;
  if (specialPage >= 0) {
    const spec = CARTA.specials || {};
    DOM.bookmarkText.textContent = t(spec.bookmark) || t(spec.title);
    DOM.bookmark.classList.toggle("is-here", State.page === specialPage);
    DOM.bookmark.setAttribute("aria-label", t(spec.title));
  }

  // Esquina de idioma: sólo tiene sentido con más de un idioma.
  if (!DOM.dogear.hidden) {
    DOM.dogearCode.textContent = State.lang.toUpperCase();
    DOM.dogear.style.visibility = State.opened ? "visible" : "hidden";
    DOM.dogearMenu.querySelectorAll(".lang").forEach(b =>
      b.setAttribute("aria-current", b.dataset.lang === State.lang ? "true" : "false"));
  }

  // Portada, portadilla e índice no pertenecen a ninguna sección: ahí
  // ninguna pestaña está activa, y eso también es información.
  const active = sectionOf(State.page);
  DOM.tabs.querySelectorAll(".tab").forEach(tab => {
    tab.setAttribute("aria-current", tab.dataset.section === active ? "true" : "false");
  });
}

/* ═══════════════════════════════════════════════════════════════
   IMAGES — carga escalonada: nunca 20 fotografías de golpe
   ═══════════════════════════════════════════════════════════════ */
function preloadAround(index) {
  for (let i = 1; i <= CONFIG.preloadAhead; i++) {
    const next = State.pages[index + i];
    if (next && next.type === "dish" && next.dish.image) {
      const img = new Image();
      img.decoding = "async";
      // Mismo srcset y mismo sizes que la página real: así el navegador
      // resuelve a la misma URL y la foto se descarga una sola vez.
      const set = imageSources(next.dish.image);
      if (set) { img.srcset = set; img.sizes = CONFIG.imageSizes; }
      img.src = next.dish.image;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   INTERACTIONS
   ═══════════════════════════════════════════════════════════════ */

/** Presión sobre la fotografía: profundidad y luz, sin zoom agresivo. */
function bindPhotoPress(figure) {
  const on = () => figure.classList.add("is-press");
  const off = () => figure.classList.remove("is-press");
  figure.addEventListener("pointerdown", on);
  figure.addEventListener("pointerup", off);
  figure.addEventListener("pointercancel", off);
  figure.addEventListener("pointerleave", off);
}

function clearPress() {
  document.querySelectorAll(".dish__photo.is-press")
    .forEach(node => node.classList.remove("is-press"));
}

/* ── GESTO: arrastrar la página ───────────────────────────────────
   Mientras el dedo manda, la hoja la coloca JS. Al soltar, el control
   pasa a los mismos keyframes del giro normal, posicionados en el
   fotograma que corresponde al ángulo actual: ni salto ni animación
   distinta según cómo hayas llegado hasta ahí.                     */

/** Ángulo de la hoja para un desplazamiento horizontal del dedo. */
function dragAngle(dx) {
  const reach = Math.max(1, (DOM.viewport.clientWidth || 320) * CONFIG.swipeSpan);
  const travel = Math.max(0, Math.abs(dx) - CONFIG.swipeDead);
  const p = Math.min(1, travel / reach);
  // Al retroceder, la hoja entra desde fuera del lomo (−92°, aún oculta).
  return Drag.dir === 1 ? -(p * 100) : -92 + p * 92;
}

function paintDrag() {
  DOM.leaf.style.transform = "rotateY(" + Drag.deg.toFixed(2) + "deg)";
  const p = Math.min(1, Math.abs(Drag.deg) / 92);
  const cos = Math.max(0.04, Math.cos(Drag.deg * Math.PI / 180));
  DOM.viewport.style.setProperty("--dp", p.toFixed(3));
  DOM.viewport.style.setProperty("--dcast", (p * (1 - p) * 2.2).toFixed(3));
  DOM.viewport.style.setProperty("--dcos", cos.toFixed(3));
}

function onDragStart(e) {
  if (!State.opened || State.animating || Sheet.open) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest("button, a")) return;   // los controles mandan sobre el gesto
  Drag.active = true; Drag.decided = false; Drag.id = e.pointerId;
  Drag.x0 = e.clientX; Drag.y0 = e.clientY; Drag.t0 = performance.now();
  Drag.dir = 0; Drag.deg = 0;
}

function onDragMove(e) {
  if (!Drag.active || e.pointerId !== Drag.id) return;
  const dx = e.clientX - Drag.x0;
  const dy = e.clientY - Drag.y0;

  if (!Drag.decided) {
    // Nada se mueve hasta que el gesto es inequívocamente horizontal.
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dy) > Math.abs(dx)) { Drag.active = false; return; }

    const dir = dx < 0 ? 1 : -1;
    const to = State.page + dir;
    if (to < 0 || to >= State.pages.length) { Drag.active = false; return; }

    Drag.decided = true; Drag.dir = dir; Drag.from = State.page; Drag.to = to;
    State.animating = true;
    clearPress();
    try { DOM.viewport.setPointerCapture(e.pointerId); } catch (err) {}
    mountTurn(Drag.from, Drag.to);
    DOM.viewport.classList.add("turning", "is-dragging",
      dir === 1 ? "turning--next" : "turning--prev");
  }

  Drag.deg = dragAngle(dx);
  paintDrag();
}

function onDragEnd(e) {
  if (!Drag.active) return;
  if (e && e.pointerId != null && e.pointerId !== Drag.id) return;
  Drag.active = false;
  if (!Drag.decided) return;            // fue un toque, no un gesto

  try { DOM.viewport.releasePointerCapture(Drag.id); } catch (err) {}

  const dx = (e && e.clientX != null ? e.clientX : Drag.x0) - Drag.x0;
  const speed = Math.abs(dx) / Math.max(1, performance.now() - Drag.t0);
  const far = Drag.dir === 1 ? Drag.deg <= -38 : Drag.deg >= -46;
  const flick = Math.abs(dx) > 26 && speed > CONFIG.swipeFlick;
  const commit = far || flick;

  // Completar = seguir en la misma dirección. Cancelar = reproducir la
  // contraria desde el mismo ángulo, y la hoja vuelve por donde vino.
  const useNext = (Drag.dir === 1) === commit;
  const seek = useNext ? curveTimeFor(Drag.deg) : 1 - curveTimeFor(Drag.deg);
  const target = commit ? Drag.to : Drag.from;

  DOM.viewport.classList.remove("is-dragging", "turning--next", "turning--prev");
  ["--dp", "--dcast", "--dcos"].forEach(v => DOM.viewport.style.removeProperty(v));
  DOM.leaf.style.removeProperty("transform");

  playLeaf(useNext ? "turning--next" : "turning--prev", false, seek);

  // El tramo que queda es proporcional a lo que falta: soltar cerca del
  // final resuelve rápido, soltar al principio recorre todo el camino.
  const remaining = Math.max(120, CONFIG.turnMs * (1 - seek));
  if (commit) window.setTimeout(() => playReveal(pageNode(target)), remaining * 0.4);
  finishTurn(target, false, remaining, true);
}

function bindInteractions() {
  DOM.btnNext.addEventListener("click", () => turn(1));
  DOM.btnPrev.addEventListener("click", () => turn(-1));

  // Abrir el libro: el botón o cualquier punto de la portada.
  DOM.viewport.addEventListener("click", (e) => {
    if (State.opened || State.animating) return;
    if (e.target.closest(".page--cover")) turn(1);
  });

  DOM.sheetClose.addEventListener("click", closeSheet);
  DOM.sheetScrim.addEventListener("click", closeSheet);
  DOM.chipTable.addEventListener("click", openTableSheet);
  DOM.chipCart.addEventListener("click", openCartSheet);
  DOM.themeToggle.addEventListener("click", () =>
    setMode(State.mode === "night" ? "day" : "night", true));
  DOM.bookmark.addEventListener("click", () => {
    const page = State.pages.findIndex(p => p.type === "special");
    if (page >= 0) jumpTo(page);
  });
  DOM.dogearFold.addEventListener("click", () => toggleDogear());
  // La esquina se cierra al tocar fuera o al mover el libro.
  DOM.viewport.addEventListener("pointerdown", e => {
    if (!e.target.closest("#dogear")) closeDogear();
  }, true);

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && Sheet.open) { e.preventDefault(); closeSheet(); return; }
    if (Sheet.open) return;          // con el panel abierto, el libro no se mueve
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); turn(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); turn(-1); }
    else if (e.key === "Home") { e.preventDefault(); jumpTo(0); }
    else if (e.key === "End") { e.preventDefault(); jumpTo(State.pages.length - 1); }
    else if (e.key === "Enter" && !State.opened && document.activeElement === document.body) turn(1);
  });

  // Gesto de pase de página
  DOM.viewport.addEventListener("pointerdown", onDragStart);
  DOM.viewport.addEventListener("pointermove", onDragMove);
  DOM.viewport.addEventListener("pointerup", onDragEnd);
  DOM.viewport.addEventListener("pointercancel", onDragEnd);
  DOM.viewport.addEventListener("lostpointercapture", onDragEnd);
  // Si el dedo sale del libro sin soltar, la hoja no se queda colgada.
  window.addEventListener("blur", () => onDragEnd(null));

  // Si el navegador reduce el movimiento a mitad de sesión, lo respetamos.
  const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
  const applyMotion = () => {
    State.reducedMotion = mq.matches;
    CONFIG.turnMs = mq.matches ? 20 : MOTION.turnMs;
    CONFIG.openMs = mq.matches ? 20 : MOTION.openMs;
    CONFIG.riffleMs = mq.matches ? 20 : MOTION.riffleMs;
    if (mq.matches) {
      document.documentElement.style.setProperty("--px", "0");
      document.documentElement.style.setProperty("--py", "0");
    }
  };
  applyMotion();
  if (mq.addEventListener) mq.addEventListener("change", applyMotion);
}

/* ═══════════════════════════════════════════════════════════════
   INIT — ningún fallo opcional puede dejar la carta en blanco
   ═══════════════════════════════════════════════════════════════ */
function init() {
  document.documentElement.dataset.preset = (CARTA.theme && CARTA.theme.preset) || "gastrobar";

  // Idioma: lo elegido antes, si no el del navegador, si no el de la casa.
  const stored = Store.get("lang");
  const guess = (navigator.language || "").slice(0, 2).toLowerCase();
  setLanguage(stored || (languages().indexOf(guess) >= 0 ? guess : null)
    || CARTA.settings.defaultLanguage || "es", true);
  document.title = CARTA.restaurant.name + " · Carta";

  // Modo: la hora del dispositivo manda, salvo elección previa.
  State.mode = null;
  setMode(Store.get("mode") || autoMode(), false);

  State.pages = buildPages();
  State.sections = buildSections(State.pages);
  State.page = 0;
  renderTabs();

  // Mesa y pedido se recuperan de la sesión: no se vuelve a preguntar.
  State.table = tableMode() ? Store.get("table") : null;
  State.order = canOrder() ? loadOrder() : [];

  // Si el restaurante no usa ni mesa ni pedido, la barra superior no
  // existe y el libro recupera ese espacio.
  renderDogear();
  const usesTopbar = tableMode() || canOrder()
    || (CARTA.theme.manualToggle !== false && CARTA.theme.dayMode !== false && CARTA.theme.nightMode !== false);
  DOM.topbar.hidden = !usesTopbar;
  document.documentElement.dataset.topbar = usesTopbar ? "on" : "off";

  // Los textos de la interfaz también salen de CARTA, nunca del HTML.
  DOM.tabs.setAttribute("aria-label", ui("sections"));
  DOM.controls.setAttribute("aria-label", ui("nav"));
  DOM.btnPrev.setAttribute("aria-label", ui("prevPage"));
  DOM.btnNext.setAttribute("aria-label", ui("nextPage"));
  DOM.sheetClose.setAttribute("aria-label", ui("close"));

  DOM.layer.replaceChildren(pageNode(0));
  playReveal(pageNode(0));

  // El libro se posa sobre la mesa; después la clase desaparece. Con red
  // de seguridad: si el navegador congela las animaciones (pestaña en
  // segundo plano), animationend no llega y el libro se quedaría invisible.
  DOM.book.classList.add("is-entering");
  const settled = () => DOM.book.classList.remove("is-entering");
  DOM.book.addEventListener("animationend", function drop(e) {
    if (e.animationName !== "bookIn") return;
    DOM.book.removeEventListener("animationend", drop);
    settled();
  });
  window.setTimeout(settled, 1400);

  // La hoja es siempre transitoria y está marcada aria-hidden: su
  // contenido tampoco debe poder recibir foco con el teclado.
  if ("inert" in HTMLElement.prototype) DOM.leaf.inert = true;

  bindInteractions();
  startParallax();
  startPointerParallax();
  syncChrome();
  preloadAround(0);
}

/* Si algo falla en mitad de un giro, el libro se quedaría bloqueado con
   State.animating en true. Esto lo devuelve a un estado usable. */
function recover() {
  try {
    State.animating = false;
    Drag.active = false;
    DOM.leafHost.replaceChildren();
    DOM.viewport.className = "book__viewport";
    DOM.leaf.style.removeProperty("transform");
    setLayer(pageNode(State.page));
    syncChrome();
  } catch (e) { /* ya no hay nada más que intentar */ }
}

window.addEventListener("error", () => { if (State.animating) recover(); });
window.addEventListener("unhandledrejection", () => { if (State.animating) recover(); });

try { init(); }
catch (err) {
  // Última red: si algo falla, al menos se ve la portada, no una pantalla rota.
  console.error("[carta] init:", err);
  document.getElementById("staticLayer").innerHTML =
    '<article class="page page--cover"><div class="cover__frame">' +
    '<h1 class="cover__name">' + (CARTA.restaurant ? CARTA.restaurant.name : "Carta") + '</h1>' +
    '</div></article>';
}
</script>
</body>
</html>
